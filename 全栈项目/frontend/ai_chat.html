    <meta charset="UTF-8">

    <title>AI 流式聊天 · WangAI</title>
    <link rel="stylesheet" href="fonts/wang_iconfont.css">
    <link rel="stylesheet" href="css/wang_style.css">
    <style>
        /* 姓名：王云鹤 | 学号：24002060416 | 时间：2026-11-12 | 大模型：Qwen3.8-Flash */
        /* HUD 深色主题（ui-ux-pro-max 设计系统），公共样式见 css/wang_style.css */
        .wang_ai_head {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 20px; border-bottom: 1px solid var(--wang_border);
            font-size: 15px; font-weight: bold; color: #C7D7F5;
        }
        .wang_ai_head i { color: var(--wang_purple); font-size: 20px; }
        .wang_ai_head small { font-weight: normal; color: var(--wang_muted_fg); font-size: 12px; margin-left: auto; }
        .wang_msg_err .wang_bubble { background: rgba(239, 68, 68, .1); border: 1px solid rgba(239, 68, 68, .45); color: var(--wang_danger); }

        /* 会话条目操作按钮 */
        .wang_s_act { display: flex; gap: 5px; flex: none; }
        .wang_s_act button {
            border: 1px solid var(--wang_border); background: var(--wang_muted); color: var(--wang_muted_fg);
            width: 22px; height: 22px; border-radius: 6px; font-size: 11px; cursor: pointer; line-height: 1;
            transition: color .2s, border-color .2s;
        }
        .wang_s_act button:hover { color: var(--wang_accent_hi); border-color: var(--wang_accent); }

        /* 停止按钮（流式期间显示） */
        #wang_stopBtn { display: none; background: rgba(239, 68, 68, .08); color: var(--wang_danger); border: 1.5px solid rgba(239, 68, 68, .45); box-shadow: none; }
    </style>
</head>

            </div>
            <div class="wang_msg_area" id="wang_msgArea">

            <div class="wang_input_bar">
