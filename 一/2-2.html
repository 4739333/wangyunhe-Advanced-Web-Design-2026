<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0416王云鹤</title>
    <style>
        /* 表格样式 */
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 30px auto;
            font-family: "Microsoft YaHei", sans-serif;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        caption {
            font-size: 26px;
            font-weight: bold;
            color: #c0392b;
            padding: 16px 0 12px 0;
            letter-spacing: 4px;
        }

        th {
            background-color: #2c3e50;
            color: #fff;
            font-size: 18px;
            padding: 14px 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        td {
            padding: 12px 20px;
            text-align: center;
            font-size: 16px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #eaf2f8;
            transition: 0.3s;
        }

        td:first-child,
        th:first-child {
            width: 15%;
        }
        td:nth-child(2),
        th:nth-child(2) {
            width: 50%;
        }
        td:last-child,
        th:last-child {
            width: 35%;
        }

        body {
            padding: 20px;
            background: #f0f2f5;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }
        .nav-links a {
            margin: 0 16px;
            color: #2980b9;
            text-decoration: none;
            font-size: 16px;
        }
        .nav-links a:hover {
            text-decoration: underline;
            color: #1a5276;
        }

        /* 图片容器：flex 一行居中 */
        .image-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;          /* 图片间距 */
            flex-wrap: nowrap;  /* 强制一行 */
            margin: 20px 0;
        }

        /* 统一图片尺寸 */
        .image-gallery img {
            width: 300px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: block;     /* 去除行内间隙 */
        }

        /* 图片超链接样式（可选） */
        .image-gallery a {
            display: inline-block;
            transition: transform 0.2s;
        }
        .image-gallery a:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- 超链接 -->
    <div class="nav-links">
        <a href="https://www.huanqiu.com">环球网</a>
        <a href="https://www.baidu.com" target="_blank">百度</a>
        <a href="./2-1.html">本地超链接，相对路径</a>
    </div>

    <!-- 三张图片：一行居中，并且每个图片都是超链接（小扩展） -->
    <div class="image-gallery">
        <a href="#" target="_blank"><img src="./img/1.jpg" alt="图片1" /></a>
        <a href="#" target="_blank"><img src="./img/2.jpg" title="seo用，搜索引擎优化" alt="图片2" /></a>
        <a href="#" target="_blank"><img src="./img/3.jpg" alt="图片3" /></a>
    </div>

    <!-- 表格：大国重器（四行三列，含表头） -->
    <table>
        <caption>⚙️ 大国重器</caption>
        <thead>
            <tr>
                <th>序号</th>
                <th>名称</th>
                <th>领域 / 类别</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>天宫空间站</td>
                <td>载人航天</td>
            </tr>
            <tr>
                <td>2</td>
                <td>蛟龙号载人潜水器</td>
                <td>深海探测</td>
            </tr>
            <tr>
                <td>3</td>
                <td>复兴号动车组</td>
                <td>高速铁路</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
