<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画长廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .zhang_subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .zhang_corridor {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 20px 10px 40px;
            scroll-snap-type: x mandatory;
        }

        .zhang_corridor::-webkit-scrollbar {
            height: 8px;
        }

        .zhang_corridor::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 4px;
        }

        .zhang_corridor::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .zhang_card {
            min-width: 260px;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            scroll-snap-align: start;
            border: 1px solid #2a2a4a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .zhang_card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .zhang_card h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .zhang_demo-area {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f23;
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .zhang_desc {
            color: #888;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .zhang_bounce-ball {
            width: 30px;
            height: 30px;
            background: #e91e63;
            border-radius: 50%;
            animation: zhang_bounce 1s ease-in-out infinite;
        }

        @keyframes zhang_bounce {
            0%, 100% { transform: translateY(-30px); }
            50% { transform: translateY(30px); }
        }

        .zhang_pulse-ring {
            width: 40px;
            height: 40px;
            border: 3px solid #4caf50;
            border-radius: 50%;
            animation: zhang_pulse 1.5s ease-out infinite;
        }

        @keyframes zhang_pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .zhang_rotate-square {
            width: 40px;
            height: 40px;
            background: #2196f3;
            animation: zhang_rotate 2s linear infinite;
        }

        @keyframes zhang_rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .zhang_fade-box {
            width: 60px;
            height: 60px;
            background: #ff9800;
            border-radius: 8px;
            animation: zhang_fade 2s ease-in-out infinite;
        }

        @keyframes zhang_fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .zhang_scale-box {
            width: 50px;
            height: 50px;
            background: #9c27b0;
            border-radius: 8px;
            animation: zhang_scale 1.5s ease-in-out infinite;
        }

        @keyframes zhang_scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .zhang_skew-box {
            width: 50px;
            height: 50px;
            background: #00bcd4;
            animation: zhang_skew 2s ease-in-out infinite;
        }

        @keyframes zhang_skew {
            0%, 100% { transform: skewX(0deg); }
            25% { transform: skewX(20deg); }
            75% { transform: skewX(-20deg); }
        }

        .zhang_translate-box {
            width: 40px;
            height: 40px;
            background: #ff5722;
            border-radius: 50%;
            animation: zhang_translate 2s ease-in-out infinite;
        }

        @keyframes zhang_translate {
            0%, 100% { transform: translateX(-40px); }
            50% { transform: translateX(40px); }
        }

        .zhang_color-box {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            animation: zhang_color 3s linear infinite;
        }

        @keyframes zhang_color {
            0% { background: #e91e63; }
            25% { background: #2196f3; }
            50% { background: #4caf50; }
            75% { background: #ff9800; }
            100% { background: #e91e63; }
        }

        .zhang_border-box {
            width: 50px;
            height: 50px;
            border: 3px solid #ffc107;
            animation: zhang_border 2s ease-in-out infinite;
        }

        @keyframes zhang_border {
            0%, 100% { border-radius: 0; border-width: 3px; }
            50% { border-radius: 50%; border-width: 6px; }
        }

        .zhang_shadow-box {
            width: 50px;
            height: 50px;
            background: #673ab7;
            border-radius: 8px;
            animation: zhang_shadow 2s ease-in-out infinite;
        }

        @keyframes zhang_shadow {
            0%, 100% { box-shadow: 0 0 0 rgba(103, 58, 183, 0.5); }
            50% { box-shadow: 0 0 30px rgba(103, 58, 183, 0.8); }
        }

        .zhang_back-home {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px 24px;
            background: #2196f3;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .zhang_back-home:hover {
            background: #1976d2;
        }
    </style>
    <style>
        /* ===== 美化层：仅增强视觉，不改变内容 ===== */
        body {
            background:
                radial-gradient(900px 420px at 15% -5%, rgba(33, 150, 243, .14), transparent 60%),
                radial-gradient(900px 420px at 85% 105%, rgba(156, 39, 176, .14), transparent 60%),
                #0f0f23;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #4facfe, #00f2fe, #a18cd1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .zhang_subtitle { color: #9aa0c3; letter-spacing: 1px; }

        .zhang_corridor { padding: 24px 12px 44px; }

        .zhang_corridor::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #4facfe, #a18cd1);
        }

        .zhang_card {
            background: linear-gradient(160deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(6px);
        }

        .zhang_card:hover {
            border-color: rgba(79, 172, 254, .45);
            box-shadow: 0 14px 44px rgba(79, 172, 254, .18);
        }

        .zhang_card h3 {
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 10px;
        }

        .zhang_card h3::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            border-radius: 1px;
            background: linear-gradient(90deg, #4facfe, #a18cd1);
        }

        .zhang_demo-area {
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255, 255, 255, .05);
            box-shadow: inset 0 0 24px rgba(0, 0, 0, .5);
        }

        .zhang_desc { color: #9aa0c3; }

        .zhang_back-home {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 6px 20px rgba(79, 172, 254, .35);
            letter-spacing: 2px;
            transition: transform .25s ease, box-shadow .25s ease, background .3s ease;
        }

        .zhang_back-home:hover {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(79, 172, 254, .5);
        }
    </style>
</head>
<body>
    <h1>动画长廊</h1>
    <p class="zhang_subtitle">左右滑动查看各种 CSS3 动画效果</p>

    <div class="zhang_corridor">
        <div class="zhang_card">
            <h3>弹跳动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_bounce-ball"></div>
            </div>
            <p class="zhang_desc">上下弹跳效果</p>
        </div>

        <div class="zhang_card">
            <h3>脉冲扩散</h3>
            <div class="zhang_demo-area">
                <div class="zhang_pulse-ring"></div>
            </div>
            <p class="zhang_desc">圆环扩散消失</p>
        </div>

        <div class="zhang_card">
            <h3>旋转动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_rotate-square"></div>
            </div>
            <p class="zhang_desc">持续顺时针旋转</p>
        </div>

        <div class="zhang_card">
            <h3>淡入淡出</h3>
            <div class="zhang_demo-area">
                <div class="zhang_fade-box"></div>
            </div>
            <p class="zhang_desc">透明度渐变循环</p>
        </div>

        <div class="zhang_card">
            <h3>缩放动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_scale-box"></div>
            </div>
            <p class="zhang_desc">大小缩放循环</p>
        </div>

        <div class="zhang_card">
            <h3>倾斜动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_skew-box"></div>
            </div>
            <p class="zhang_desc">左右倾斜变换</p>
        </div>

        <div class="zhang_card">
            <h3>平移动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_translate-box"></div>
            </div>
            <p class="zhang_desc">左右平移运动</p>
        </div>

        <div class="zhang_card">
            <h3>颜色变换</h3>
            <div class="zhang_demo-area">
                <div class="zhang_color-box"></div>
            </div>
            <p class="zhang_desc">背景色循环变化</p>
        </div>

        <div class="zhang_card">
            <h3>边框动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_border-box"></div>
            </div>
            <p class="zhang_desc">形状与边框变化</p>
        </div>

        <div class="zhang_card">
            <h3>阴影动画</h3>
            <div class="zhang_demo-area">
                <div class="zhang_shadow-box"></div>
            </div>
            <p class="zhang_desc">发光阴影效果</p>
        </div>
    </div>

    <a href="index.html" class="zhang_back-home">返回首页</a>
</body>
</html>
