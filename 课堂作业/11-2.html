<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 3D 动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        h1 {
            color: #fff;
            margin-bottom: 40px;
            text-align: center;
        }

        .wyh_scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            margin: 30px 0;
        }

        .wyh_cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: wyh_rotate 8s linear infinite;
        }

        .wyh_face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
        }

        .wyh_front  { background: rgba(233, 30, 99, 0.7);  transform: translateZ(100px); }
        .wyh_back   { background: rgba(76, 175, 80, 0.7);  transform: rotateY(180deg) translateZ(100px); }
        .wyh_right  { background: rgba(33, 150, 243, 0.7);  transform: rotateY(90deg) translateZ(100px); }
        .wyh_left   { background: rgba(255, 152, 0, 0.7);  transform: rotateY(-90deg) translateZ(100px); }
        .wyh_top    { background: rgba(156, 39, 176, 0.7);  transform: rotateX(90deg) translateZ(100px); }
        .wyh_bottom { background: rgba(0, 188, 212, 0.7);  transform: rotateX(-90deg) translateZ(100px); }

        @keyframes wyh_rotate {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }

        .wyh_cards {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }

        .wyh_card {
            width: 150px;
            height: 200px;
            perspective: 500px;
            cursor: pointer;
        }

        .wyh_card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .wyh_card:hover .wyh_card-inner {
            transform: rotateY(180deg);
        }

        .wyh_card-front,
        .wyh_card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
        }

        .wyh_card-front {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .wyh_card-back {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            transform: rotateY(180deg);
        }

        .wyh_pyramid-scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            margin: 30px 0;
        }

        .wyh_pyramid {
            width: 0;
            height: 0;
            position: relative;
            transform-style: preserve-3d;
            animation: wyh_spin 6s linear infinite;
        }

        @keyframes wyh_spin {
            from { transform: rotateY(0deg) rotateX(20deg); }
            to   { transform: rotateY(360deg) rotateX(20deg); }
        }

        .wyh_section {
            margin: 40px 0;
            text-align: center;
        }

        .wyh_section h2 {
            color: #ccc;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .wyh_carousel-scene {
            width: 220px;
            height: 150px;
            perspective: 700px;
            margin: 20px auto;
        }

        .wyh_carousel {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: wyh_carousel-rotate 12s linear infinite;
        }

        .wyh_carousel-item {
            position: absolute;
            width: 220px;
            height: 150px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .wyh_carousel-item:nth-child(1) { background: rgba(233,30,99,0.8);  transform: rotateY(0deg) translateZ(200px); }
        .wyh_carousel-item:nth-child(2) { background: rgba(76,175,80,0.8);  transform: rotateY(72deg) translateZ(200px); }
        .wyh_carousel-item:nth-child(3) { background: rgba(33,150,243,0.8);  transform: rotateY(144deg) translateZ(200px); }
        .wyh_carousel-item:nth-child(4) { background: rgba(255,152,0,0.8);  transform: rotateY(216deg) translateZ(200px); }
        .wyh_carousel-item:nth-child(5) { background: rgba(156,39,176,0.8); transform: rotateY(288deg) translateZ(200px); }

        @keyframes wyh_carousel-rotate {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }

        .wyh_flip-scene {
            display: flex;
            gap: 40px;
            margin: 20px 0;
        }

        .wyh_flip-box {
            width: 100px;
            height: 100px;
            perspective: 400px;
        }

        .wyh_flip-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: wyh_flip 3s ease-in-out infinite;
        }

        .wyh_flip-inner:nth-child(2) {
            animation-delay: 0.5s;
        }

        .wyh_flip-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }

        .wyh_flip-front {
            background: rgba(0, 188, 212, 0.8);
            transform: translateZ(50px);
        }

        .wyh_flip-back {
            background: rgba(255, 87, 34, 0.8);
            transform: rotateY(180deg) translateZ(50px);
        }

        @keyframes wyh_flip {
            0%, 100% { transform: rotateY(0deg); }
            50%      { transform: rotateY(180deg); }
        }
    </style>
    <style>
        /* ===== 美化层：仅增强视觉，不改变内容 ===== */
        body {
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(102, 126, 234, .25), transparent 60%),
                radial-gradient(900px 500px at 85% 30%, rgba(233, 30, 99, .15), transparent 60%),
                radial-gradient(700px 500px at 50% 110%, rgba(0, 188, 212, .18), transparent 60%),
                #14142b;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #a8c0ff, #667eea, #f093fb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(102, 126, 234, .45));
            margin-bottom: 48px;
        }

        .wyh_section {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 30px 34px 40px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
            transition: transform .3s ease, border-color .3s ease;
        }

        .wyh_section:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, .18);
        }

        .wyh_section h2 {
            color: #e6e6f0;
            letter-spacing: 2px;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }

        .wyh_section h2::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: 56px;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(90deg, #667eea, #f093fb);
        }

        .wyh_face {
            border-radius: 6px;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, .12);
        }

        .wyh_card-front, .wyh_card-back {
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
        }

        .wyh_card:hover .wyh_card-inner {
            filter: drop-shadow(0 0 14px rgba(240, 147, 251, .5));
        }

        .wyh_carousel-item {
            box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
        }

        /* 补齐 HTML 中下划线类名 wyh_flip_face 的基础样式，使翻转盒子正常呈现 */
        .wyh_flip_face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            backface-visibility: hidden;
        }
    </style>
</head>
<body>
    <h1>CSS3 3D 动画展示</h1>

    <div class="wyh_section">
        <h2>3D 立方体旋转</h2>
        <div class="wyh_scene">
            <div class="wyh_cube">
                <div class="wyh_face wyh_front">前</div>
                <div class="wyh_face wyh_back">后</div>
                <div class="wyh_face wyh_right">右</div>
                <div class="wyh_face wyh_left">左</div>
                <div class="wyh_face wyh_top">上</div>
                <div class="wyh_face wyh_bottom">下</div>
            </div>
        </div>
    </div>

    <div class="wyh_section">
        <h2>3D 卡片翻转（hover 触发）</h2>
        <div class="wyh_cards">
            <div class="wyh_card">
                <div class="wyh_card-inner">
                    <div class="wyh_card-front">正面</div>
                    <div class="wyh_card-back">背面</div>
                </div>
            </div>
            <div class="wyh_card">
                <div class="wyh_card-inner">
                    <div class="wyh_card-front">HTML</div>
                    <div class="wyh_card-back">5</div>
                </div>
            </div>
            <div class="wyh_card">
                <div class="wyh_card-inner">
                    <div class="wyh_card-front">CSS</div>
                    <div class="wyh_card-back">3</div>
                </div>
            </div>
        </div>
    </div>

    <div class="wyh_section">
        <h2>3D 旋转木马</h2>
        <div class="wyh_carousel-scene">
            <div class="wyh_carousel">
                <div class="wyh_carousel-item">1</div>
                <div class="wyh_carousel-item">2</div>
                <div class="wyh_carousel-item">3</div>
                <div class="wyh_carousel-item">4</div>
                <div class="wyh_carousel-item">5</div>
            </div>
        </div>
    </div>

    <div class="wyh_section">
        <h2>3D 翻转动画</h2>
        <div class="wyh_flip-scene">
            <div class="wyh_flip-box">
                <div class="wyh_flip-inner">
                    <div class="wyh_flip_face wyh_flip-front">正</div>
                    <div class="wyh_flip_face wyh_flip-back">反</div>
                </div>
            </div>
            <div class="wyh_flip-box">
                <div class="wyh_flip-inner">
                    <div class="wyh_flip_face wyh_flip-front">正</div>
                    <div class="wyh_flip_face wyh_flip-back">反</div>
                </div>
            </div>
            <div class="wyh_flip-box">
                <div class="wyh_flip-inner">
                    <div class="wyh_flip_face wyh_flip-front">正</div>
                    <div class="wyh_flip_face wyh_flip-back">反</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
